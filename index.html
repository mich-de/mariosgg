<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Mario's Game Gallery</title>
<link rel="icon" href="assets/icon.png">
<style>
  :root { --bg: #000; --fg: #ffe94a; --dim: #b8a24a; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden;
    font-family: "Courier New", ui-monospace, monospace; -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; touch-action: none; overscroll-behavior: none; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  /* The 320x200 frame is meant for a 4:3 display (non-square pixels). */
  #screen { display: block; width: min(100vw, calc(100vh * 4 / 3)); width: min(100dvw, calc(100dvh * 4 / 3));
    aspect-ratio: 4 / 3; height: auto; touch-action: none; background: #000; image-rendering: auto; }
  #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; text-align: center; padding: 16px; background: #000; z-index: 10; }
  #loading h1 { margin: 0; font-size: clamp(18px, 5vw, 32px); letter-spacing: 1px; }
  #loading p { margin: 0; color: var(--dim); font-size: 14px; max-width: 34em; }
  #bar { width: min(320px, 70vw); height: 10px; border: 2px solid var(--fg); }
  #bar > div { height: 100%; width: 0; background: var(--fg); }
  #loading button { font: inherit; font-size: 18px; padding: 10px 22px; color: #000; background: var(--fg);
    border: 0; border-radius: 4px; cursor: pointer; display: none; }
  #fs { position: fixed; right: 6px; bottom: 6px; z-index: 5; font: 12px sans-serif; padding: 6px 9px; color: #ccc;
    background: rgba(40,40,40,.6); border: 1px solid #555; border-radius: 4px; display: none; transition: opacity .6s; }
  #fs.faded { opacity: .35; }
  #rotate { position: fixed; left: 0; right: 0; top: 12px; text-align: center; font: 13px sans-serif; color: #aaa;
    display: none; pointer-events: none; }
  @media (orientation: portrait) and (max-width: 700px) { #rotate.show { display: block; } }
  #kb { position: fixed; left: 0; top: 0; width: 1px; height: 1px; opacity: 0; font-size: 16px; border: 0; padding: 0; }
</style>
</head>
<body>
<div id="stage"><canvas id="screen" width="1600" height="1200"></canvas></div>
<div id="loading">
  <h1>Mario's Game Gallery</h1>
  <div id="bar"><div></div></div>
  <p id="status">Loading game data...</p>
  <button id="start">Start</button>
</div>
<button id="fs" type="button">Fullscreen</button>
<div id="rotate">Turn your device sideways for a bigger board</div>
<input id="kb" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-hidden="true">
<script type="module" src="js/main.js"></script>
</body>
</html>
